server:
  port: 9092
  ssl:
    key-store: classpath:certs/springboot-server.p12
    key-store-type: PKCS12
    key-store-password: changeit
    key-alias: springboot

spring:
  application:
    name: SpringBoot_Shibboleth_SAML_App2
  security:
    saml2:
      relyingparty:
        registration:
          shibboleth:
            # Entity ID by which Shibboleth knows this Spring Boot Service Provider. It should match the client ID in keycloak
            entity-id: SpringBoot_Shibboleth_SAML_App2
            signing:
              credentials:
                - private-key-location: classpath:saml/signingcerts/spring-saml.key
                  certificate-location: classpath:saml/signingcerts/spring-saml.crt
            assertingparty:
              # Shibboleth publishes its SAML IdP entity ID, SSO endpoints, bindings,
              # and signing certificate through this metadata document.
              metadata-uri: classpath:saml/shibboleth-metadata.xml

logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.saml2: DEBUG
